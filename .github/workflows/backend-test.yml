name: Backend tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test requirements
        run: pip install -r backend/requirements.txt
      - name: Test FastAPI
        working-directory: backend
        run: pytest -q
