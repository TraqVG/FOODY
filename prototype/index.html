<symbol id="ic-history" viewBox="0 0 24 24"><rect x="4" y="3" width="13" height="17" rx="2"/><path d="M7.5 8h6M7.5 12h4"/><circle cx="17" cy="17.5" r="5.5"/><path d="M17 14.5v3.5l2 1"/></symbol>

<symbol id="ic-menu" viewBox="0 0 24 24"><path d="M4 3v6M7 3v6M10 3v6M7 9v12M17 3c-3 2-3 7-3 10h4V3Zm0 10v8"/></symbol>

<symbol id="ic-logout" viewBox="0 0 24 24"><path d="M11 4H4v16h7M14 7l5 5-5 5M8 12h11"/></symbol>

<symbol id="ic-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="11" rx="2"/><path d="M7.5 11V8a4.5 4.5 0 1 1 9 0v3"/></symbol>

</svg>
<div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="overlay"></div>
<script>window.FOODY_IMAGES=[];</script>

<script src="assets/food-2.js"></script>
<script src="assets/food-3.js"></script>
<script src="assets/food-4.js"></script>

<script>
/* UI DEMO ONLY. Accounts and data below are intentionally local mock data, not real authentication. */
const FOOD_IMAGES = window.FOODY_IMAGES;
const ACCOUNTS = [
 {email:'staff@foody.shop',name:'พิม',role:'staff',label:'พนักงานเสิร์ฟ'},
 {email:'kitchen@foody.shop',name:'นัท',role:'kitchen',label:'พนักงานครัว'},
 {email:'owner@foody.shop',name:'ต้น',role:'owner',label:'เจ้าของร้าน'}
];
const DEFAULT_MENUS=[
 {id:1,name:'ข้าวกะเพราหมูสับ',price:69,category:'อาหารจานเดียว',image:0,available:true},
 {id:2,name:'ข้าวผัดกุ้ง',price:89,category:'อาหารจานเดียว',image:1,available:true},
 {id:3,name:'ผัดซีอิ๊วหมู',price:79,category:'อาหารจานเดียว',image:2,available:true},
 {id:4,name:'ชาไทย',price:45,category:'เครื่องดื่ม',image:3,available:true},
 {id:5,name:'ผัดกะเพราไก่',price:65,category:'อาหารจานเดียว',image:4,available:true},
 {id:6,name:'ต้มยำกุ้ง',price:120,category:'ต้มยำ/แกง',image:5,available:true},
 {id:7,name:'ผัดไทยกุ้ง',price:85,category:'อาหารจานเดียว',image:6,available:false},
 {id:8,name:'ข้าวเหนียวมะม่วง',price:60,category:'ของหวาน',image:7,available:true}
];
const LOCAL_KEY='foody_ui_v4_demo';
function demoSeed(){const now=Date.now();const item=(id,qty,note='')=>{let m=DEFAULT_MENUS.find(x=>x.id===id);return{menuId:id,name:m.name,price:m.price,qty,note,image:m.image}};
return {storeName:'Foody Kitchen',menus:DEFAULT_MENUS.map(x=>({...x})),tables:Array.from({length:6},(_,i)=>({id:i+1,guests:i+1===2?4:i+1===3?2:i+1===6?2:0,sessionId:i+1===2?'s2':i+1===3?'s3':i+1===6?'s6':null})),orders:[
 {id:'F1001',tableId:2,sessionId:'s2',staff:'staff@foody.shop',items:[item(1,2),item(4,1)],status:'pending',createdAt:now-17*60000},
 {id:'F1002',tableId:3,sessionId:'s3',staff:'staff@foody.shop',items:[item(3,1),item(4,1)],status:'ready',createdAt:now-15*60000},
 {id:'F1003',tableId:6,sessionId:'s6',staff:'staff@foody.shop',items:[item(2,1),item(6,1)],status:'pending',createdAt:now-5*60000}],
 sales:[{id:'F0999',tableId:4,staff:'staff@foody.shop',items:[item(1,2),item(3,1)],total:217,paidAt:now-90*60000,guests:2},{id:'F0998',tableId:5,staff:'staff@foody.shop',items:[item(2,1),item(4,2)],total:179,paidAt:now-180*60000,guests:3},{id:'F0997',tableId:1,staff:'staff@foody.shop',items:[item(6,1),item(1,1)],total:189,paidAt:now-210*60000,guests:2},
 {id:'F0962',tableId:3,staff:'staff@foody.shop',items:[item(1,3),item(6,2)],total:447,paidAt:now-7*86400000,guests:5},
 {id:'F0904',tableId:5,staff:'staff@foody.shop',items:[item(2,1),item(6,1)],total:209,paidAt:now-38*86400000,guests:2}],
 nextId:1004,notificationEnabled:true,updatedAt:now};}
function loadData(){try{const r=localStorage.getItem(LOCAL_KEY);if(r){const p=JSON.parse(r);if(p&&Array.isArray(p.tables)&&Array.isArray(p.menus)&&Array.isArray(p.orders))return p;}}catch(e){}return demoSeed()}
let data=loadData();let user=null;let view='login';let selectedTable=1;let guests=1;let menuCategory='ทั้งหมด';let menuSearch='';let historyFilter='วันนี้';let kitchenFilter='pending';let ownerSearch='';let formId=null;let formImage=0;let drafts={};let notesOpen={};let guestTyped=false;let settingsFrom='';let noticeText='';let modal=null;let loginEmail='';let loginPass='';let showPassword=false;let toastTimer=null;
function persist(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(data))}catch(e){}}
function h(t){return String(t??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function svg(name,size=20){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-${name}"></use></svg>`}
function money(v){return '฿'+(Number(v)||0).toLocaleString('th-TH',{maximumFractionDigits:0})}
function niceTime(t){return new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t))}
function shortDate(t){return new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'short'}).format(new Date(t))}
function bkkDateParts(t){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(t));const o={};for(const x of p)o[x.type]=x.value;return o}
function dayKey(t){const p=bkkDateParts(t);return `${p.year}-${p.month}-${p.day}`}
function sameDay(t){return dayKey(t)===dayKey(Date.now())}
function monthMatch(t){return dayKey(t).slice(0,7)===dayKey(Date.now()).slice(0,7)}
function yearMatch(t){return dayKey(t).slice(0,4)===dayKey(Date.now()).slice(0,4)}
function hourBkk(t){return Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Bangkok',hour:'2-digit',hour12:false,hourCycle:'h23'}).format(new Date(t)))%24}
function priceSum(items){return items.reduce((a,i)=>a+i.qty*i.price,0)}
function table(n){return data.tables.find(t=>t.id===Number(n))}
function liveOrders(t){return data.orders.filter(o=>o.tableId===t.id&&o.sessionId===t.sessionId)}
function orderLines(t){return liveOrders(t).flatMap(o=>o.items.map(i=>({...i,status:o.status,orderId:o.id})))}
function allReady(t){let os=liveOrders(t);return os.length>0&&os.every(o=>o.status==='ready')}
function setView(v){view=v;render();const s=document.getElementById('scroll');if(s)s.scrollTop=0}
function notify(text){const x=document.getElementById('toast');x.textContent=text;x.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove('show'),2600)}
function topbar(){if(view==='login')return '';const back=['table','menu','cart','checkout','settings','ownerform','password','storeinfo','help','notifications'].includes(view);let title={tables:'โต๊ะอาหาร',history:'ประวัติออเดอร์',table:`รายละเอียดโต๊ะ`,menu:'เลือกเมนู',cart:'รายการสั่ง',checkout:'เช็กบิล',kitchen:'คิวครัว',reports:'รายงาน',manage:'จัดการเมนู',settings:'ตั้งค่า',ownerform:formId?'แก้ไขเมนู':'เพิ่มเมนู',password:'เปลี่ยนรหัสผ่าน',storeinfo:'ข้อมูลร้าน',help:'ความช่วยเหลือ',notifications:'การแจ้งเตือน'}[view]||'Foody';
return `<header class="header"><div class="head-inner app-width">${back?`<button class="icon-btn back" data-act="back" aria-label="ย้อนกลับ">${svg('left')}</button>`:''}<div class="head-title">${!back?`<div class="brand-small">Foody</div>`:''}<div class="page-title">${h(title)}</div>${view==='menu'?`<small>โต๊ะ ${selectedTable} · ${table(selectedTable)?.guests||1} คน</small>`:''}</div>${view!=='settings'&&view!=='password'&&view!=='storeinfo'&&view!=='help'&&view!=='notifications'?`<button class="icon-btn profile" data-act="settings" aria-label="โปรไฟล์และตั้งค่า">${svg('user')}</button>`:''}</div></header>`}
function nav(){if(['login','settings','table','menu','cart','checkout','ownerform','password','storeinfo','help','notifications'].includes(view)||!user||user.role==='kitchen')return '';
let items=user.role==='staff'?[['tables','โต๊ะ','table'],['history','ประวัติ','history']]:[['reports','รายงาน','report'],['manage','เมนู','menu']];
return `<nav class="bottom-nav" aria-label="เมนูหลัก"><div class="nav-inner">${items.map(([k,label,i])=>`<button class="navitem ${view===k?'active':''}" data-act="navigate" data-target="${k}" aria-current="${view===k?'page':'false'}">${svg(i,23)}${label}</button>`).join('')}</div></nav>`}
function dock(content){return `<div class="action-area"><div class="action-inner">${content}</div></div>`}
function loginScreen(){return `<div class="login-bg"><div class="login-panel"><div class="login-logo"><span class="login-mark">${svg('menu',26)}</span><strong>Foody</strong></div><h1 class="login-title">เข้าสู่ระบบ</h1><p class="login-desc">สำหรับพนักงานภายในร้านเท่านั้น</p><div id="login-error" class="login-error ${noticeText?'show':''}" role="alert">${h(noticeText)}</div><form id="loginForm" autocomplete="on"><div class="form-field"><label for="email">อีเมลร้าน</label><input id="email" type="email" autocomplete="username" placeholder="name@foody.shop" required value="${h(loginEmail)}"></div><div class="form-field"><label for="pass">รหัสผ่าน</label><div class="password-wrap"><input id="pass" type="${showPassword?'text':'password'}" placeholder="รหัสผ่าน" autocomplete="current-password" required value="${h(loginPass)}"><button type="button" data-act="togglepass" aria-label="${showPassword?'ซ่อน':'แสดง'}รหัสผ่าน">${svg('eye')}</button></div></div><button class="btn primary wide" type="submit" style="margin-top:9px">เข้าสู่ระบบ</button></form><details class="demo-details"><summary>บัญชีทดลอง (กดเพื่อดู)</summary><div class="helptext" style="margin-top:8px">รหัสผ่านตัวอย่าง: <b>foody123</b></div>${ACCOUNTS.map(a=>`<button class="demo-row" data-act="fill" data-email="${h(a.email)}"><span>${h(a.email)}</span><strong>${h(a.label)}</strong></button>`).join('')}</details></div></div>`}
function tablesScreen(){const free=data.tables.filter(t=>!t.guests).length,occ=6-free;return `<div class="stats-row"><div class="mini-stat available">${svg('table')} ว่าง <em>${free}</em></div><div class="mini-stat occupied">${svg('users')} มีลูกค้า <em>${occ}</em></div></div><div class="table-grid">${data.tables.map(t=>{let count=t.guests?liveOrders(t).length:0;let ready=t.guests&&liveOrders(t).some(o=>o.status==='ready');return `<button class="table-card" data-act="table" data-id="${t.id}" aria-label="โต๊ะ ${t.id} ${t.guests?'มีลูกค้า '+t.guests+' คน':'ว่าง'}"><div class="table-upper"><div class="row" style="gap:6px"><span class="table-symbol">${svg('table')}</span><span class="table-n">โต๊ะ ${t.id}</span></div><span class="pill ${t.guests?'orange-bg':'green-bg'}">${t.guests?'มีลูกค้า':'ว่าง'}</span></div><div class="tables-description">${svg(t.guests?'users':'table')}<span>${t.guests?`<b>${t.guests} คน</b> · ${count} ออเดอร์`:'พร้อมเปิดโต๊ะ'}</span></div>${ready?`<span class="pill green-bg" style="align-self:flex-start">${svg('check',13)} อาหารพร้อม</span>`:''}</button>`}).join('')}</div>`}
function tableScreen(){const t=table(selectedTable);if(!t)return `<p>ไม่พบโต๊ะ</p>`;if(!t.guests){return `<div class="card info-card"><span class="table-symbol">${svg('table')}</span><div class="info-big">โต๊ะ ${t.id}</div><span class="pill green-bg">ว่าง</span></div><h2 class="section-title">จำนวนลูกค้า</h2><div class="count-box"><button class="round-control" data-act="guestminus" aria-label="ลดจำนวนลูกค้า">${svg('minus')}</button><div class="count-val" aria-live="polite">${guests}</div><button class="round-control" data-act="guestplus" aria-label="เพิ่มจำนวนลูกค้า">${svg('plus')}</button></div><div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-act="digit" data-n="${n}">${n}</button>`).join('')}<div></div><button class="key" data-act="digit" data-n="0">0</button><button class="key" data-act="backspace" aria-label="ลบตัวเลข">${svg('delete')}</button></div>`}
const lines=orderLines(t), sum=priceSum(lines), tickets=liveOrders(t);return `<div class="card info-card" style="margin-bottom:14px"><span class="table-symbol">${svg('table')}</span><div class="grow"><div class="info-big">โต๊ะ ${t.id}</div><div class="info-extra">${svg('users',15)} ${t.guests} คน</div></div><span class="pill orange-bg">มีลูกค้า</span></div><div class="card list-card"><div class="row between" style="padding:3px 0 11px"><h2 class="section-title">รายการอาหาร</h2><span class="micro">${lines.reduce((s,i)=>s+i.qty,0)} ชิ้น</span></div>${lines.length?lines.map(i=>`<div class="item-row"><img class="thumb" src="${FOOD_IMAGES[i.image%FOOD_IMAGES.length]}" alt=""><div class="grow"><div class="item-name">${h(i.name)}</div><span class="pill ${i.status==='ready'?'green-bg':'orange-bg'} ticket-badge">${i.status==='ready'?'พร้อมเสิร์ฟ':'รอครัว'}</span></div><div class="text-right"><div class="price">${money(i.price*i.qty)}</div><div class="micro">×${i.qty}</div></div></div>`).join(''):`<div class="empty" style="padding:28px 10px">${svg('receipt')}<strong>ยังไม่มีออเดอร์</strong></div>`}<div class="order-total"><span>ยอดรวม</span><span class="total-big">${money(sum)}</span></div></div>${tickets.some(o=>o.status==='ready')?`<div class="notice" style="margin-top:12px;background:#e8f6ec;color:#197348">${svg('bell',17)} มีอาหารพร้อมเสิร์ฟจากครัว</div>`:''}`}
function menuScreen(){const t=table(selectedTable);let catalog=data.menus.filter(m=>m.available).filter(m=>menuCategory==='ทั้งหมด'||m.category===menuCategory).filter(m=>m.name.toLowerCase().includes(menuSearch.trim().toLowerCase()));const categories=['ทั้งหมด','อาหารจานเดียว','เครื่องดื่ม','ต้มยำ/แกง','ของหวาน'];let qtys=drafts[selectedTable]||{};return `<label class="searchbox" aria-label="ค้นหาเมนู">${svg('search')}<input id="menuSearch" placeholder="ค้นหาเมนู" value="${h(menuSearch)}" autocomplete="off"></label><div class="selectline hscroll">${categories.map(c=>`<button class="chip ${menuCategory===c?'active':''}" data-act="category" data-value="${h(c)}">${h(c)}</button>`).join('')}</div>${catalog.length?`<div class="menu-grid">${catalog.map(m=>`<div class="food-card"><img loading="lazy" src="${FOOD_IMAGES[m.image%FOOD_IMAGES.length]}" alt="${h(m.name)}"><div class="food-info"><div class="food-name">${h(m.name)}</div><div class="food-price-row"><div><div class="food-price">${money(m.price)}</div>${qtys[m.id]?.qty?`<div class="mini-count">ในรายการ ${qtys[m.id].qty}</div>`:''}</div><button class="food-add" data-act="add" data-id="${m.id}" aria-label="เพิ่ม ${h(m.name)}">${svg('plus',16)} เพิ่ม</button></div></div></div>`).join('')}</div>`:`<div class="empty">${svg('search')}<strong>ไม่พบเมนู</strong><p>ลองเปลี่ยนคำค้นหาหรือหมวดหมู่</p></div>`}`}
function cartLines(){return Object.values(drafts[selectedTable]||{}).filter(i=>i.qty>0)}

function reportsScreen(){const today=data.sales.filter(s=>sameDay(s.paidAt)),month=data.sales.filter(s=>monthMatch(s.paidAt)),year=data.sales.filter(s=>yearMatch(s.paidAt));const sum=a=>a.reduce((v,s)=>v+s.total,0);const startHour=Math.max(0,Math.min(17,hourBkk(Date.now())-3));const labels=Array.from({length:7},(_,i)=>String(startHour+i).padStart(2,'0'));const values=labels.map(x=>today.filter(s=>String(hourBkk(s.paidAt)).padStart(2,'0')===x).reduce((v,s)=>v+s.total,0));let max=Math.max(...values,1);return `<div class="report-stats"><div class="report-stat current"><small>วันนี้</small><strong>${money(sum(today))}</strong></div><div class="report-stat"><small>เดือนนี้</small><strong>${money(sum(month))}</strong></div><div class="report-stat"><small>ปีนี้</small><strong>${money(sum(year))}</strong></div></div><div class="report-main"><section class="card report-chart"><h2 class="section-title">ยอดขายวันนี้</h2><div class="chart" role="img" aria-label="ยอดขายรายชั่วโมงจากข้อมูลทดลอง">${values.map((v,i)=>`<div class="bar-col"><div class="bar" title="${labels[i]} น.: ${money(v)}" style="height:${Math.max(3,v/max*113)}px"></div><small>${labels[i]}</small></div>`).join('')}</div></section><section class="card sales-list"><h2 class="section-title" style="padding:8px 0 10px">รายการขายวันนี้</h2>${today.length?[...today].sort((a,b)=>b.paidAt-a.paidAt).map(s=>`<div class="sales-line"><span class="muted">${niceTime(s.paidAt)}</span><span class="tagn">โต๊ะ ${s.tableId}</span><strong>${money(s.total)}</strong></div>`).join(''):`<div class="empty" style="padding:19px"><strong>ยังไม่มีการขายวันนี้</strong></div>`}</section></div>`}

function closeModal(){modal=null;document.getElementById('overlay').innerHTML=''}
const passwords={};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;let act=b.dataset.act,id=Number(b.dataset.id),val=b.dataset.value;
switch(act){
case 'fill':loginEmail=b.dataset.email;loginPass='foody123';noticeText='';render();break;
case 'togglepass':{loginEmail=document.getElementById('email')?.value||'';loginPass=document.getElementById('pass')?.value||'';showPassword=!showPassword;render();document.getElementById('pass')?.focus();break}
case 'navigate':setView(b.dataset.target);break;
case 'settings':settingsFrom=view;setView('settings');break;
case 'back':gotoBack();break;
case 'table':selectedTable=id;guests=1;guestTyped=false;setView('table');break;
case 'digit':{let n=Number(b.dataset.n);guests=guestTyped? Number(String(guests)+String(n)) : n;guests=Math.max(1,Math.min(99,guests));guestTyped=true;render();break}
case 'guestminus':guests=Math.max(1,guests-1);guestTyped=false;render();break;
case 'guestplus':guests=Math.min(99,guests+1);guestTyped=false;render();break;
case 'backspace':guests=Math.max(1,Math.floor(guests/10)||1);guestTyped=true;render();break;
case 'open':{let t=table(selectedTable);if(t.guests){notify('โต๊ะนี้เปิดอยู่แล้ว');break}t.guests=guests;t.sessionId='session-'+Date.now()+'-'+t.id;persist();menuCategory='ทั้งหมด';menuSearch='';setView('menu');notify(`เปิดโต๊ะ ${t.id} แล้ว`);break}
case 'more':menuCategory='ทั้งหมด';menuSearch='';setView('menu');break;
case 'category':menuCategory=val;render();break;
case 'add':{let m=data.menus.find(x=>x.id===id);if(!m?.available){notify('เมนูนี้หยุดขาย');break}if(!drafts[selectedTable])drafts[selectedTable]={};let d=drafts[selectedTable];if(!d[id])d[id]={menuId:m.id,name:m.name,price:m.price,qty:0,image:m.image,note:''};d[id].qty++;render();notify('เพิ่ม '+m.name);break}
case 'cart':setView('cart');break;
case 'backmenu':setView('menu');break;
case 'increase':{let i=drafts[selectedTable]?.[id];if(i){i.qty++;render()}break}
case 'decrease':{let i=drafts[selectedTable]?.[id];if(i){i.qty--;if(i.qty<=0)delete drafts[selectedTable][id];render()}break}
case 'togglenote':notesOpen[id]=!notesOpen[id];render();break;
case 'submit':{let lines=cartLines();if(!lines.length){notify('กรุณาเลือกอาหาร');break}if(!table(selectedTable)?.guests){notify('ต้องเปิดโต๊ะก่อน');break}let invalid=lines.find(i=>!data.menus.some(m=>m.id===i.menuId&&m.available));if(invalid){notify(`เมนู ${invalid.name} หยุดขายแล้ว`);break}let newOrder={id:'F'+data.nextId++,tableId:selectedTable,sessionId:table(selectedTable).sessionId,staff:user.email,items:lines.map(i=>({...i})),status:'pending',createdAt:Date.now()};data.orders.push(newOrder);drafts[selectedTable]={};notesOpen={};persist();setView('table');notify('ส่งออเดอร์เข้าครัวแล้ว');break}
case 'checkout':{let t=table(selectedTable);if(!liveOrders(t).length){notify('ยังไม่มีรายการอาหาร');break}setView('checkout');break}
case 'pay':{let t=table(selectedTable);if(!allReady(t)){notify('กรุณารออาหารเสร็จก่อน');break}showConfirm('ยืนยันเช็กบิล','บันทึกการชำระเงินจำลองและปิดโต๊ะ '+t.id+' ใช่หรือไม่?',()=>{let os=liveOrders(t);let lines=os.flatMap(o=>o.items);let pm=document.querySelector('input[name="payment"]:checked')?.value||'cash';let completedAt=Date.now();data.sales.push({id:'B'+data.nextId++,tableId:t.id,staff:os[0]?.staff||user.email,items:lines.map(i=>({...i})),total:priceSum(lines),paidAt:completedAt,guests:t.guests,paymentMethod:pm});data.orders=data.orders.filter(o=>o.sessionId!==t.sessionId);t.guests=0;t.sessionId=null;persist();setView('tables');notify('เช็กบิลและปิดโต๊ะแล้ว')},false);break}
case 'historyfilter':historyFilter=val;render();break;
case 'kfilter':kitchenFilter=val;render();break;
case 'complete':{let o=data.orders.find(o=>o.id===b.dataset.id);if(o&&o.status==='pending'){o.status='ready';o.readyAt=Date.now();persist();render();notify(`โต๊ะ ${o.tableId} อาหารเสร็จแล้ว · แจ้งพนักงาน`)}break}
case 'availability':{let m=data.menus.find(m=>m.id===id);if(m){m.available=!m.available;persist();render();notify(m.available?'เปิดขายแล้ว':'หยุดขายแล้ว')}break}
case 'newmenu':formId=null;formImage=0;setView('ownerform');break;
case 'edit':{let m=data.menus.find(x=>x.id===id);formId=id;formImage=m.image;setView('ownerform');break}
case 'photo':formImage=Number(b.dataset.i);document.querySelectorAll('.photo-choice').forEach(x=>x.classList.toggle('selected',Number(x.dataset.i)===formImage));let hi=document.getElementById('foodImage');if(hi)hi.value=formImage;break;
case 'delete':{let m=data.menus.find(m=>m.id===id);if(m)showConfirm('ลบเมนู',`ต้องการลบ “${m.name}” หรือไม่? รายการออเดอร์เดิมจะยังถูกเก็บไว้`,()=>{data.menus=data.menus.filter(x=>x.id!==id);persist();render();notify('ลบเมนูแล้ว')});break}
case 'storeinfo':setView('storeinfo');break;
case 'notifications':setView('notifications');break;
case 'notif-toggle':data.notificationEnabled=!data.notificationEnabled;persist();render();notify('บันทึกการตั้งค่าแล้ว');break;
case 'password':setView('password');break;
case 'help':setView('help');break;
case 'logout':user=null;noticeText='';loginEmail='';loginPass='';view='login';drafts={};render();break;
case 'modalcancel':closeModal();break;
case 'modalconfirm':{const fn=modal;closeModal();if(fn)fn();break}
}}
);
document.addEventListener('input',e=>{if(e.target.id==='menuSearch'){menuSearch=e.target.value;const p=e.target.selectionStart;const scroll=document.getElementById('scroll')?.scrollTop||0;render();let el=document.getElementById('menuSearch');if(el){el.focus();el.setSelectionRange(p,p)}document.getElementById('scroll').scrollTop=scroll}
if(e.target.id==='ownerSearch'){ownerSearch=e.target.value;const p=e.target.selectionStart;const scroll=document.getElementById('scroll')?.scrollTop||0;render();let el=document.getElementById('ownerSearch');if(el){el.focus();el.setSelectionRange(p,p)}document.getElementById('scroll').scrollTop=scroll}
if(e.target.dataset.note){let id=Number(e.target.dataset.note);if(drafts[selectedTable]?.[id])drafts[selectedTable][id].note=e.target.value}
if(e.target.id==='email')loginEmail=e.target.value;if(e.target.id==='pass')loginPass=e.target.value;
});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase(),pass=document.getElementById('pass').value;const who=ACCOUNTS.find(x=>x.email===email);if(!who||pass!==(passwords[email]||'foody123')){noticeText='อีเมลหรือรหัสผ่านไม่ถูกต้อง';loginEmail=email;loginPass='';render();return}user=who;noticeText='';view={staff:'tables',kitchen:'kitchen',owner:'reports'}[who.role];render();return}
if(e.target.id==='menuForm'){e.preventDefault();let name=document.getElementById('foodName').value.trim(),price=Number(document.getElementById('foodPrice').value),category=document.getElementById('foodCategory').value;if(!name||!Number.isInteger(price)||price<1||price>99999){notify('ตรวจสอบชื่อเมนูและราคา');return}if(formId){let m=data.menus.find(m=>m.id===formId);if(m)Object.assign(m,{name,price,category,image:formImage})}else{data.menus.unshift({id:Math.max(0,...data.menus.map(x=>x.id))+1,name,price,category,image:formImage,available:true})}persist();setView('manage');notify('บันทึกเมนูแล้ว');return}
if(e.target.id==='passwordForm'){e.preventDefault();let old=document.getElementById('oldpassword').value,pass=document.getElementById('newpassword').value;if(old!==(passwords[user.email]||'foody123')){notify('รหัสผ่านเดิมไม่ถูกต้อง');return}passwords[user.email]=pass;setView('settings');notify('เปลี่ยนรหัสผ่านใน Demo แล้ว');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
window.addEventListener('storage',e=>{if(e.key===LOCAL_KEY){data=loadData();render()}});
render();
</script>
</body></html>
