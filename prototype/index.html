function h(t){return String(t??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function svg(name,size=20){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-${name}"></use></svg>`}
function money(v){return '฿'+(Number(v)||0).toLocaleString('th-TH',{maximumFractionDigits:0})}
function niceTime(t){return new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t))}
function shortDate(t){return new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'short'}).format(new Date(t))}
function bkkDateParts(t){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(t));const o={};for(const x of p)o[x.type]=x.value;return o}
function dayKey(t){const p=bkkDateParts(t);return `${p.year}-${p.month}-${p.day}`}
function sameDay(t){return dayKey(t)===dayKey(Date.now())}
function monthMatch(t){return dayKey(t).slice(0,7)===dayKey(Date.now()).slice(0,7)}
function yearMatch(t){return dayKey(t).slice(0,4)===dayKey(Date.now()).slice(0,4)}
function hourBkk(t){return Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Bangkok',hour:'2-digit',hour12:false,hourCycle:'h23'}).format(new Date(t)))%24}
function priceSum(items){return items.reduce((a,i)=>a+i.qty*i.price,0)}
function table(n){return data.tables.find(t=>t.id===Number(n))}
function liveOrders(t){return data.orders.filter(o=>o.tableId===t.id&&o.sessionId===t.sessionId)}

function reportsScreen(){const today=data.sales.filter(s=>sameDay(s.paidAt)),month=data.sales.filter(s=>monthMatch(s.paidAt)),year=data.sales.filter(s=>yearMatch(s.paidAt));const sum=a=>a.reduce((v,s)=>v+s.total,0);const startHour=Math.max(0,Math.min(17,hourBkk(Date.now())-3));const labels=Array.from({length:7},(_,i)=>String(startHour+i).padStart(2,'0'));const values=labels.map(x=>today.filter(s=>String(hourBkk(s.paidAt)).padStart(2,'0')===x).reduce((v,s)=>v+s.total,0));let max=Math.max(...values,1);return `<div class="report-stats"><div class="report-stat current"><small>วันนี้</small><strong>${money(sum(today))}</strong></div><div class="report-stat"><small>เดือนนี้</small><strong>${money(sum(month))}</strong></div><div class="report-stat"><small>ปีนี้</small><strong>${money(sum(year))}</strong></div></div><div class="report-main"><section class="card report-chart"><h2 class="section-title">ยอดขายวันนี้</h2><div class="chart" role="img" aria-label="ยอดขายรายชั่วโมงจากข้อมูลทดลอง">${values.map((v,i)=>`<div class="bar-col"><div class="bar" title="${labels[i]} น.: ${money(v)}" style="height:${Math.max(3,v/max*113)}px"></div><small>${labels[i]}</small></div>`).join('')}</div></section><section class="card sales-list"><h2 class="section-title" style="padding:8px 0 10px">รายการขายวันนี้</h2>${today.length?[...today].sort((a,b)=>b.paidAt-a.paidAt).map(s=>`<div class="sales-line"><span class="muted">${niceTime(s.paidAt)}</span><span class="tagn">โต๊ะ ${s.tableId}</span><strong>${money(s.total)}</strong></div>`).join(''):`<div class="empty" style="padding:19px"><strong>ยังไม่มีการขายวันนี้</strong></div>`}</section></div>`}

function gotoBack(){if(['tables','history','kitchen','reports','manage'].includes(view))return;if(view==='settings'){setView(settingsFrom||({staff:'tables',kitchen:'kitchen',owner:'reports'}[user.role]));return}if(['password','storeinfo','help','notifications'].includes(view)){setView('settings');return}if(view==='ownerform'){setView('manage');return}if(view==='table'){setView('tables');return}if(view==='menu'){setView('table');return}if(view==='cart'){setView('menu');return}if(view==='checkout'){setView('table');return}}

switch(act){
case 'fill':loginEmail=b.dataset.email;loginPass='foody123';noticeText='';render();break;

case 'checkout':{let t=table(selectedTable);if(!liveOrders(t).length){notify('ยังไม่มีรายการอาหาร');break}setView('checkout');break}

case 'historyfilter':historyFilter=val;render();break;

case 'storeinfo':setView('storeinfo');break;

case 'notif-toggle':data.notificationEnabled=!data.notificationEnabled;persist();render();notify('บันทึกการตั้งค่าแล้ว');break;

case 'help':setView('help');break;
case 'logout':user=null;noticeText='';loginEmail='';loginPass='';view='login';drafts={};render();break;

);
document.addEventListener('input',e=>{if(e.target.id==='menuSearch'){menuSearch=e.target.value;const p=e.target.selectionStart;const scroll=document.getElementById('scroll')?.scrollTop||0;render();let el=document.getElementById('menuSearch');if(el){el.focus();el.setSelectionRange(p,p)}document.getElementById('scroll').scrollTop=scroll}
if(e.target.id==='ownerSearch'){ownerSearch=e.target.value;const p=e.target.selectionStart;const scroll=document.getElementById('scroll')?.scrollTop||0;render();let el=document.getElementById('ownerSearch');if(el){el.focus();el.setSelectionRange(p,p)}document.getElementById('scroll').scrollTop=scroll}
if(e.target.dataset.note){let id=Number(e.target.dataset.note);if(drafts[selectedTable]?.[id])drafts[selectedTable][id].note=e.target.value}
if(e.target.id==='email')loginEmail=e.target.value;if(e.target.id==='pass')loginPass=e.target.value;
});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase(),pass=document.getElementById('pass').value;const who=ACCOUNTS.find(x=>x.email===email);if(!who||pass!==(passwords[email]||'foody123')){noticeText='อีเมลหรือรหัสผ่านไม่ถูกต้อง';loginEmail=email;loginPass='';render();return}user=who;noticeText='';view={staff:'tables',kitchen:'kitchen',owner:'reports'}[who.role];render();return}
if(e.target.id==='menuForm'){e.preventDefault();let name=document.getElementById('foodName').value.trim(),price=Number(document.getElementById('foodPrice').value),category=document.getElementById('foodCategory').value;if(!name||!Number.isInteger(price)||price<1||price>99999){notify('ตรวจสอบชื่อเมนูและราคา');return}if(formId){let m=data.menus.find(m=>m.id===formId);if(m)Object.assign(m,{name,price,category,image:formImage})}else{data.menus.unshift({id:Math.max(0,...data.menus.map(x=>x.id))+1,name,price,category,image:formImage,available:true})}persist();setView('manage');notify('บันทึกเมนูแล้ว');return}
if(e.target.id==='passwordForm'){e.preventDefault();let old=document.getElementById('oldpassword').value,pass=document.getElementById('newpassword').value;if(old!==(passwords[user.email]||'foody123')){notify('รหัสผ่านเดิมไม่ถูกต้อง');return}passwords[user.email]=pass;setView('settings');notify('เปลี่ยนรหัสผ่านใน Demo แล้ว');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
window.addEventListener('storage',e=>{if(e.key===LOCAL_KEY){data=loadData();render()}});
render();
</script>
</body></html>
